# Alpine HPC config — full production run on GPU.
# Images are already at the path below; only code files need to be uploaded.

dataset:
  root: "/projects/danzman@colostate.edu/qCMB_hackathon"
  label_source: "folders"
  path_filter: "_4x"
  control_label: "controls"
  extensions: [".tiff", ".tif", ".png", ".jpg"]
  csv_path: "labels.csv"
  csv_image_column: "filename"
  csv_label_column: "label"
  filename_pattern: "(?P<label>[a-zA-Z_]+)_\\d+"

training:
  validation_split: 0.2
  epochs: 15
  batch_size: 8
  learning_rate: 0.0001
  image_size: 384
  use_gpu: true           # Falls back to CPU automatically if no GPU
  num_workers: 2

output:
  results_dir: "/projects/danzman@colostate.edu/qCMB_hackathon/results/"
  save_gradcam: true
  gradcam_max_images: 60
  save_umap: true
  ood_threshold: 3.0
  quantify_infection: true
  dab_threshold: 0.15
  save_infection_maps: false
  infection_maps_max_images: 20
