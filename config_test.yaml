# Smoke-test config — runs the full pipeline end-to-end in ~5-10 min on CPU.
# Verify this completes cleanly before the full run on Alpine.
# Full-run settings are in config.yaml.

dataset:
  root: "/Users/eliud.rivas/Desktop/qCMB_hackathon2026/hackathon"
  label_source: "folders"
  path_filter: "_4x"
  control_label: "control"
  extensions: [".tiff", ".tif", ".png", ".jpg"]
  csv_path: "labels.csv"
  csv_image_column: "filename"
  csv_label_column: "label"
  filename_pattern: "(?P<label>[a-zA-Z_]+)_\\d+"

training:
  validation_split: 0.2
  epochs: 2
  batch_size: 4
  learning_rate: 0.0001
  image_size: 224        # Small enough to run on CPU in minutes
  use_gpu: true          # Falls back to CPU automatically if no GPU
  num_workers: 0         # 0 avoids multiprocessing issues on macOS

output:
  results_dir: "results_test/"
  save_gradcam: true
  gradcam_max_images: 5
  save_umap: true
  ood_threshold: 3.0
  quantify_infection: false   # Skip — slow per-image processing, test separately
  dab_threshold: 0.15
  save_infection_maps: false
  infection_maps_max_images: 5
