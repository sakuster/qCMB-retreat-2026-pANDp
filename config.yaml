# ==============================================================================
# PRION BRAIN SLICE CLASSIFICATION PIPELINE — CONFIGURATION
# ==============================================================================
# This file controls everything. You should not need to edit any Python files.
# Lines starting with '#' are comments and are ignored by the program.
#
# PROJECT: qCMB 2026 — PrP Deposition Imaging Challenge
#
# DATASET OVERVIEW:
#   Three conditions, four brain regions, 4x IHC coronal sections of mouse brain.
#
#   Classes (as they appear in filenames):
#     WT_control — wild-type mice, non-prion-susceptible
#     GtElk      — gene-targeted "Elk-inized" mice infected with prions
#     GtDeer     — gene-targeted "Deer-inized" mice infected with prions
#
#   Brain regions:
#     cerebellum, hippocampus, midbrain, septum
#
#   Folder structure on disk:
#     data/
#       control/
#         cerebellum_4x/WT_control_cerebellum_4x_01.tif
#         hippocampus_4x/
#         midbrain_4x/
#         septum_4x/
#       GtDeer/  (same structure)
#       GtElk/   (same — Cerebellum_4x has capital C, handled automatically)


# ------------------------------------------------------------------------------
# DATASET SETTINGS
# ------------------------------------------------------------------------------
dataset:
  # Path to the folder containing the class subfolders (control/, GtDeer/, GtElk/).
  # "data/" keeps scans fast by excluding venv/, pipeline/, results/, etc.
  # Set to an absolute path on Alpine where the images are stored.
  root: "data/"

  # How class labels are determined.
  #   "folders"        — top-level subfolder name is the class label (control, GtDeer, GtElk).
  #                      Use this for the qCMB dataset.
  #   "region_folders" — label extracted from filename, region from folder name.
  #   "csv"            — label read from a CSV file (see csv_path below).
  #   "filename"       — label extracted via regex (see filename_pattern below).
  label_source: "folders"

  # Only include images whose path contains this string.
  # "_4x" restricts to the 4x subfolder inside each class folder.
  path_filter: "_4x"

  # ---- Settings for label_source: "csv" (not used for qCMB dataset) ----
  csv_path: "labels.csv"
  csv_image_column: "filename"
  csv_label_column: "label"

  # ---- Settings for label_source: "filename" (not used for qCMB dataset) ----
  # A regex with a named group called 'label' — test at: https://regex101.com
  filename_pattern: "(?P<label>[a-zA-Z_]+)_\\d+"

  # Image file types to search for (case-insensitive)
  extensions: [".tiff", ".tif", ".png", ".jpg"]

  # The name of the negative/uninfected control class as it appears in folder names.
  control_label: "control"


# ------------------------------------------------------------------------------
# TRAINING SETTINGS
# ------------------------------------------------------------------------------
training:
  # Fraction of images held out for validation (e.g. 0.2 = 20%)
  # These images are never shown to the model during training.
  validation_split: 0.2

  # Number of passes through the full training set.
  # 50 is a safe default; the best checkpoint is always saved automatically.
  epochs: 50

  # Number of images processed at once. Reduce if you run out of GPU memory.
  batch_size: 16

  # How fast the model learns. Lower = more stable but slower.
  learning_rate: 0.0001

  # Image dimensions in pixels after resizing.
  # 1024 preserves enough regional detail at 4x magnification.
  image_size: 1024

  # Set to false to train on CPU (much slower — not recommended)
  use_gpu: true

  # Number of CPU workers for loading images in parallel.
  # Set to 0 if you encounter multiprocessing errors.
  num_workers: 4


# ------------------------------------------------------------------------------
# OUTPUT SETTINGS
# ------------------------------------------------------------------------------
output:
  # Folder where results, figures, and the trained model will be saved.
  results_dir: "results/"

  # Generate GradCAM heatmaps showing which brain regions drove each classification.
  # Saved to results/gradcam/ — directly satisfies the challenge heatmap requirement.
  save_gradcam: true

  # How many GradCAM images to generate (saving all 691 is slow; 60 covers 2 per class/region)
  gradcam_max_images: 60

  # Generate a UMAP plot of all sample embeddings coloured by class.
  # Outlier clusters in this plot indicate potential undiscovered prion subtypes.
  save_umap: true

  # Samples scoring this many standard deviations above the mean OOD score
  # are flagged as potential new subtypes. Higher = stricter (fewer flags).
  ood_threshold: 3.0

  # Quantify the degree of PrP (DAB brown staining) deposition per image.
  # Adds infection_score, mean_dab_intensity, clean_tissue_area, and
  # artifact_area columns to predictions.csv.
  quantify_infection: true

  # Optical density threshold (0.0–1.0) above which a pixel is counted as
  # DAB-positive. 0.15 is the standard starting value for H-DAB IHC slides.
  # Increase if background staining inflates scores; decrease if staining
  # is weak. Adjust based on the save_infection_maps diagnostic panels below.
  dab_threshold: 0.15

  # Save a four-panel diagnostic image (original / tissue mask / DAB heatmap /
  # positive overlay) for each slide. Useful for verifying that artifacts
  # (tears, folds) are being correctly excluded. Slow — enable selectively.
  save_infection_maps: false

  # Maximum number of per-slide infection map images to save when
  # save_infection_maps is true. Set to a small number (20–30) for a quick check.
  infection_maps_max_images: 20
